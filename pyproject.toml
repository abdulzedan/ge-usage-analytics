[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ge-usage-analytics"
version = "1.1.0"
description = "Export Gemini Enterprise token and activity telemetry out of Google Cloud into a local SQLite database and an offline HTML dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["gemini-enterprise", "cloud-logging", "cloud-trace", "telemetry", "analytics", "sqlite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
]

# The tool itself has no runtime dependencies. It is written against the
# standard library so it can be copied onto a locked-down host and run as-is.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
# Only needed to regenerate the README screenshots (tools/capture_screenshots.py).
docs = ["pillow>=10.0"]

# A flat set of modules, not a package: the directory is meant to be copied onto
# a host and run in place, so there is nothing for setuptools to auto-discover.
# Declared so `pip install '.[dev]'` resolves, which is the only reason to
# install this at all. There is deliberately no console script -- the default
# database path sits beside the module, which is correct when the directory is
# run in place and wrong when it has been installed into site-packages.
[tool.setuptools]
py-modules = ["ge_usage", "gcp_client", "collector", "store", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are tolerated in the embedded HTML/CSS template
    "UP006", # keep typing compatible with 3.9 at runtime
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"dashboard.py" = ["W605"]
