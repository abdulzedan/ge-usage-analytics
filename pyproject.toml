[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ge-usage-analytics"
version = "1.1.0"
description = "Demo for collecting Gemini Enterprise logs and token usage in SQLite and viewing them offline. Not intended for production use."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["gemini-enterprise", "cloud-logging", "cloud-trace", "telemetry", "analytics", "sqlite"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
]

# Runtime code uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
# Only needed to regenerate the README screenshots (tools/capture_screenshots.py).
docs = ["pillow>=10.0"]

# Declare the flat modules so pip can install the optional extras.
# Run the CLI from the checkout: its default database lives beside ge_usage.py,
# so an installed console script would write into site-packages.
[tool.setuptools]
py-modules = ["ge_usage", "gcp_client", "collector", "store", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are tolerated in the embedded HTML/CSS template
    "UP006", # keep typing compatible with 3.9 at runtime
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"dashboard.py" = ["W605"]
